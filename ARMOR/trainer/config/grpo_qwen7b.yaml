# GRPO Training Configuration for Qwen2.5-7B
# Usage: bash scripts/run_training.sh multi

model:
  path: /data/hgt/models/Qwen2.5-7B-Instruct
  torch_dtype: bfloat16

data:
  train_path: data/gsm8k/train.parquet
  val_path: data/gsm8k/test.parquet
  max_samples: -1

training:
  total_epochs: 1
  batch_size: 4  # per GPU
  mini_batch_size: 4
  ppo_epochs: 4
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  gradient_checkpointing: true

lora:
  enabled: true
  rank: 32
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation:
  max_prompt_length: 512
  max_response_length: 512
  temperature: 0.8
  top_p: 0.95
  repetition_penalty: 1.1

grpo:
  kl_coef: 0.001
  clip_range: 0.2

output:
  save_dir: checkpoints
  project_name: ARMOR_qwen7b_grpo
